<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Enterprise Chatbot Demo</title>
<style>
  /* Basic dark theme, centered chat card */
  body {
    font-family: system-ui, sans-serif;
    background: #0f0f14;
    color: #eee;
    display: flex;
    justify-content: center;
    padding: 40px;
  }
  #chat-container {
    width: 480px;
    background: #1a1a22;
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    height: 640px;
  }
  #mode-select {
    margin-bottom: 10px;
    padding: 8px;
    border-radius: 8px;
    background: #2a2a35;
    color: #eee;
    border: none;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 8px;
  }
  .msg {
    padding: 10px 14px;
    border-radius: 10px;
    max-width: 80%;
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .user { align-self: flex-end; background: #4f46e5; }
  .bot { align-self: flex-start; background: #2a2a35; }
  #input-row { display: flex; gap: 8px; margin-top: 10px; }
  #user-input {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: none;
    background: #2a2a35;
    color: #eee;
  }
  button {
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: #4f46e5;
    color: white;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="chat-container">

  <!-- Lets you switch which "specialized bot" you're talking to,
       purely for this demo. In a real deployment, each page (support
       page vs careers/intranet page) would hardcode its own bot_type
       instead of showing this dropdown to end users. -->
  <select id="mode-select">
    <option value="support">Customer Support</option>
    <option value="lead_qualification">Sales / Lead Qualification</option>
    <option value="hr_support">Internal HR Support</option>
  </select>

  <div id="messages"></div>

  <div id="input-row">
    <input id="user-input" placeholder="Type a message..." />
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
  // Where the FastAPI backend is running. Change this to your deployed
  // backend URL once you host it (e.g. a Render URL).
  const API_URL = "http://localhost:8000/chat";

  // A random ID generated once per browser tab, so the backend can tell
  // different users' conversations apart from each other.
  const sessionId = crypto.randomUUID();

  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("user-input");
  const modeSelect = document.getElementById("mode-select");

  // Adds one chat bubble to the message list on screen
  function addMessage(text, sender) {
    const div = document.createElement("div");
    div.className = `msg ${sender}`;
    div.textContent = text;
    messagesEl.appendChild(div);
    // auto-scroll to the newest message
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // Sends the typed message to the backend and displays the reply
  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;   // ignore empty sends

    addMessage(text, "user");
    inputEl.value = "";

    const response = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        session_id: sessionId,
        message: text,
        bot_type: modeSelect.value,   // tells the backend which "personality" to use
      }),
    });

    const data = await response.json();
    addMessage(data.reply, "bot");

    // If this turn triggered a REAL escalation (logged on the backend),
    // show a visible confirmation so it's obvious this wasn't just the
    // model talking -- something was actually recorded.
    if (data.escalated) {
      const badge = document.createElement("div");
      badge.textContent = "🔔 Escalated to a human agent — logged on the server.";
      badge.style.cssText = "align-self:center; font-size:12px; color:#9ca3af; padding:4px;";
      messagesEl.appendChild(badge);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
  }

  // Let the user press Enter instead of clicking the button
  inputEl.addEventListener("keydown", (event) => {
    if (event.key === "Enter") sendMessage();
  });
</script>
</body>
</html>
